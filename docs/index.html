<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'none'; form-action 'none'; base-uri 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <title>Authenticator</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:        #09090b;
      --s1:        #111113;
      --s2:        #18181b;
      --s3:        #27272a;
      --border:    rgba(255,255,255,0.07);
      --border-hi: rgba(255,255,255,0.14);
      --cyan:      #22d3ee;
      --cyan-dim:  rgba(34,211,238,0.12);
      --green:     #4ade80;
      --red:       #f87171;
      --amber:     #fbbf24;
      --text:      #fafafa;
      --text2:     #a1a1aa;
      --text3:     #52525b;
      --r:         12px;
      --sans:      'Plus Jakarta Sans', sans-serif;
      --mono:      'JetBrains Mono', monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      padding: 32px 16px 80px;
    }

    .app { width: 100%; max-width: 400px; }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 28px;
    }
    .logo { display: flex; align-items: center; gap: 10px; }
    .logo-icon {
      width: 32px; height: 32px;
      background: var(--cyan-dim);
      border: 1px solid rgba(34,211,238,.4);
      border-radius: 8px;
      display: grid;
      place-items: center;
    }
    .logo-icon svg { width: 16px; height: 16px; }
    .logo-name { font-size: 15px; font-weight: 700; letter-spacing: -.01em; }
    .logo-badge { font-size: 10px; font-family: var(--mono); color: var(--text3); letter-spacing: .04em; }

    /* ── Panel ── */
    .panel { background: var(--s1); border: 1px solid var(--border); border-radius: var(--r); padding: 24px; }
    .panel-title { font-size: 20px; font-weight: 700; margin-bottom: 6px; }
    .panel-sub   { font-size: 13px; color: var(--text3); margin-bottom: 20px; }

    /* ── Inputs ── */
    .field { margin-bottom: 8px; }
    .field input, input.bare {
      width: 100%;
      padding: 11px 14px;
      background: var(--s2);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: var(--sans);
      font-size: 14px;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    .field input:focus, input.bare:focus {
      border-color: var(--cyan);
      box-shadow: 0 0 0 3px rgba(34,211,238,.1);
    }
    .field input::placeholder, input.bare::placeholder { color: var(--text3); }

    /* ── Buttons ── */
    .btn {
      display: flex; align-items: center; justify-content: center; gap: 7px;
      width: 100%; padding: 11px 16px;
      border: none; border-radius: 8px;
      font-family: var(--sans); font-size: 14px; font-weight: 600;
      cursor: pointer; transition: opacity .15s, transform .1s; margin-top: 8px;
    }
    .btn:active { transform: scale(.98); }
    .btn:disabled { opacity: .4; pointer-events: none; }
    .btn-primary { background: var(--cyan); color: #000; }
    .btn-ghost   { background: var(--s2); color: var(--text2); border: 1px solid var(--border); }
    .btn-ghost:hover { border-color: var(--border-hi); color: var(--text); }
    .btn-danger  { background: rgba(248,113,113,.1); color: var(--red); border: 1px solid rgba(248,113,113,.2); }
    .btn-danger:hover { background: rgba(248,113,113,.18); }

    .err { font-size: 12px; color: var(--red); font-family: var(--mono); min-height: 16px; margin-top: 6px; }

    /* ── Migration notice ── */
    #migrate-notice {
      display: none;
      background: rgba(251,191,36,.08);
      border: 1px solid rgba(251,191,36,.25);
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 12px; color: var(--amber);
      margin-bottom: 14px; line-height: 1.6;
    }
    #migrate-notice.visible { display: block; }
    #vault-warn { display: none; background: rgba(248,113,113,.08); border: 1px solid rgba(248,113,113,.25); border-radius: 8px; padding: 10px 14px; font-size: 12px; color: var(--red); margin-bottom: 10px; line-height: 1.6; }
    #vault-warn.visible { display: block; }
    .acc:focus-visible, .acc-del:focus-visible { outline: 2px solid var(--cyan); outline-offset: 2px; }
    .acc-del:focus-visible { opacity: 1; }
    @media (hover: none) { .acc-del { opacity: 1; } }

    /* ── Vault header ── */
    #vault-screen { display: none; }
    .vault-hd { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; }
    .search-wrap { flex: 1; position: relative; }
    .search-wrap svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--text3); pointer-events: none; }
    .search-wrap input.bare { padding-left: 34px; padding-top: 9px; padding-bottom: 9px; }
    .search-wrap input.bare:focus { border-color: var(--border-hi); box-shadow: none; }
    .icon-btn {
      flex-shrink: 0; width: 36px; height: 36px;
      background: var(--s2); border: 1px solid var(--border); border-radius: 8px;
      cursor: pointer; display: grid; place-items: center;
      transition: border-color .15s, color .15s; color: var(--text3);
    }
    .icon-btn:hover { border-color: var(--border-hi); color: var(--text); }
    .icon-btn svg { width: 16px; height: 16px; }

    /* ── Account cards ── */
    #accs { margin-bottom: 16px; }
    .acc {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 16px;
      background: var(--s2); border: 1px solid var(--border); border-radius: var(--r);
      margin-bottom: 6px; cursor: pointer;
      transition: border-color .18s, background .18s; position: relative;
    }
    .acc:hover { border-color: var(--border-hi); background: var(--s3); }
    .acc:hover .acc-del { opacity: 1; }

    .acc-avatar {
      flex-shrink: 0; width: 38px; height: 38px; border-radius: 10px;
      display: grid; place-items: center;
      font-size: 14px; font-weight: 700; text-transform: uppercase;
    }
    .acc-body { flex: 1; min-width: 0; }
    .acc-name {
      font-size: 11px; font-weight: 600; color: var(--text2);
      margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      letter-spacing: .02em;
    }
    .acc-code {
      font-family: var(--mono); font-size: 22px; font-weight: 700;
      color: var(--text); letter-spacing: .1em;
    }
    .acc-hint { font-size: 10px; font-family: var(--mono); color: var(--text3); margin-top: 2px; height: 13px; }

    /* ring */
    .acc-ring { flex-shrink: 0; position: relative; width: 36px; height: 36px; }
    .acc-ring svg { transform: rotate(-90deg); }
    .ring-bg { stroke: var(--s3); }
    .ring-fg { stroke: var(--cyan); }
    .ring-fg.urgent { stroke: var(--red); }
    .ring-num {
      position: absolute; inset: 0; display: grid; place-items: center;
      font-size: 11px; font-family: var(--mono); font-weight: 700; color: var(--text2);
    }

    /* delete */
    .acc-del {
      position: absolute; top: 10px; right: 10px;
      width: 24px; height: 24px; background: var(--s3);
      border: 1px solid var(--border); border-radius: 6px;
      cursor: pointer; display: grid; place-items: center;
      opacity: 0; transition: opacity .15s, background .15s; color: var(--text3);
    }
    .acc-del:hover { background: rgba(248,113,113,.15); color: var(--red); border-color: rgba(248,113,113,.3); }
    .acc-del svg { width: 12px; height: 12px; }

    .empty { text-align: center; padding: 40px 0 32px; color: var(--text3); font-size: 13px; font-family: var(--mono); }
    .empty svg { width: 36px; height: 36px; margin: 0 auto 12px; display: block; opacity: .25; }

    /* ── Add / actions ── */
    .sep { border: none; border-top: 1px solid var(--border); margin: 16px 0; }
    .section-hd { font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--text3); margin-bottom: 10px; }
    #reader-wrap { display: none; border-radius: var(--r); overflow: hidden; margin-bottom: 8px; }
    .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 4px; }

    /* ── Modal ── */
    .backdrop {
      display: none; position: fixed; inset: 0;
      background: rgba(0,0,0,.75);
      z-index: 200; align-items: center; justify-content: center; padding: 16px;
    }
    .backdrop.open { display: flex; }
    .modal { background: var(--s1); border: 1px solid var(--border-hi); border-radius: var(--r); padding: 24px; width: 100%; max-width: 360px; }
    .modal-title { font-size: 16px; font-weight: 700; margin-bottom: 6px; }
    .modal-sub   { font-size: 13px; color: var(--text3); margin-bottom: 16px; line-height: 1.6; }
    .modal-row   { display: flex; gap: 8px; margin-top: 8px; }
    .modal-row .btn { margin-top: 0; }

    /* ── Idle bar ── */
    #idle-bar { position: fixed; top: 0; left: 0; height: 2px; background: var(--cyan); transition: width .9s linear, background .5s; z-index: 999; width: 100%; }

    .restore-link { display: block; text-align: center; margin-top: 16px; font-size: 12px; color: var(--text3); cursor: pointer; transition: color .15s; }
    .restore-link:hover { color: var(--cyan); }
  </style>
</head>
<body>

<div id="idle-bar"></div>

<!-- Export modal -->
<div class="backdrop" id="export-modal">
  <div class="modal">
    <div class="modal-title">Confirm export</div>
    <div class="modal-sub">Re-enter your master password to download the encrypted backup.</div>
    <div class="field"><input type="password" id="export-pass" autocomplete="current-password" placeholder="Master password"></div>
    <div class="err" id="export-err"></div>
    <div class="modal-row">
      <button class="btn btn-ghost" id="export-cancel">Cancel</button>
      <button class="btn btn-primary" id="export-go">Download</button>
    </div>
  </div>
</div>

<!-- Import modal -->
<div class="backdrop" id="import-modal">
  <div class="modal">
    <div class="modal-title">Import backup</div>
    <div class="modal-sub" id="import-sub">Enter the master password the backup was created with.</div>
    <div class="field"><input type="password" id="import-pass" autocomplete="current-password" placeholder="Backup master password"></div>
    <div class="err" id="import-err"></div>
    <div class="modal-row">
      <button class="btn btn-ghost" id="import-cancel">Cancel</button>
      <button class="btn btn-primary" id="import-go">Import</button>
    </div>
  </div>
</div>

<div class="app">
  <header>
    <div class="logo">
      <div class="logo-icon">
        <svg viewBox="0 0 16 16" fill="none" stroke="#22d3ee" stroke-width="1.5" stroke-linecap="round">
          <rect x="2" y="7" width="12" height="8" rx="2"/>
          <path d="M5 7V5a3 3 0 0 1 6 0v2"/>
          <circle cx="8" cy="11" r="1" fill="#22d3ee" stroke="none"/>
        </svg>
      </div>
      <div>
        <div class="logo-name">Authenticator</div>
        <div class="logo-badge">TOTP · AES-256 · <span id="app-ver"></span></div>
      </div>
    </div>
  </header>

  <!-- Lock screen -->
  <div id="lock-screen">
    <div class="panel">
      <div class="panel-title" id="lock-title">Unlock vault</div>
      <div class="panel-sub" id="lock-sub">Enter your master password to access your codes.</div>
      <div id="migrate-notice"></div>
      <div class="field">
        <input type="password" id="master-pass" placeholder="Master password" autocomplete="current-password">
      </div>
      <button class="btn btn-primary" id="unlock-btn">Unlock</button>
      <div class="err" id="fail-msg"></div>
      <label class="restore-link">
        Import backup
        <input type="file" id="import-file" style="display:none" accept=".json">
      </label>
    </div>
  </div>

  <!-- Vault screen -->
  <div id="vault-screen">
    <div class="vault-hd">
      <div class="search-wrap">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5">
          <circle cx="8.5" cy="8.5" r="5.5"/><path d="m13 13 3.5 3.5" stroke-linecap="round"/>
        </svg>
        <input type="text" class="bare" id="search-bar" placeholder="Search accounts…">
      </div>
      <button class="icon-btn" id="lock-btn" title="Lock">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <rect x="4" y="9" width="12" height="9" rx="2"/><path d="M7 9V6a3 3 0 0 1 6 0v3"/>
        </svg>
      </button>
    </div>

    <div id="vault-warn"></div>
    <div id="accs"></div>

    <hr class="sep">
    <div class="section-hd">Add account</div>
    <div class="field"><input type="text" id="new-label" autocomplete="off" placeholder="Label (e.g. GitHub)"></div>
    <div class="field"><input type="text" id="new-secret" autocomplete="off" spellcheck="false" placeholder="Secret key (base32)"></div>
    <div id="reader-wrap"><div id="reader"></div></div>
    <div class="err" id="add-err"></div>
    <div class="two-col">
      <button class="btn btn-ghost" id="scan-btn">
        <svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round">
          <rect x="3" y="3" width="5" height="5" rx="1"/><rect x="12" y="3" width="5" height="5" rx="1"/>
          <rect x="3" y="12" width="5" height="5" rx="1"/><path d="M12 12h5v5M15 12v2"/>
        </svg>
        Scan QR
      </button>
      <button class="btn btn-primary" id="add-btn">+ Add</button>
    </div>

    <hr class="sep">
    <div class="section-hd">Vault</div>
    <div class="two-col">
      <button class="btn btn-ghost" id="export-open">↓ Export backup</button>
      <button class="btn btn-danger" id="wipe-btn">Wipe all data</button>
    </div>
  </div>
</div>

<script src="vendor/otpauth.umd.min.js"></script>
<script src="vendor/html5-qrcode.min.js"></script>
<script src="app.js"></script>
</body>
</html>
